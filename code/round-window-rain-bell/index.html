<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; worker-src blob:"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Round Window Rain Bell</title><style>html,body{margin:0;height:100%;background:#1b1a2e;color:#d9d4f0;font-family:Georgia,serif;text-align:center}body{display:flex;flex-direction:column;align-items:center;justify-content:center}h1{font-size:1.4rem;margin:.4rem}p{margin:.2rem .8rem .5rem;font-size:.95rem}canvas{width:min(80vw,55vh);height:min(80vw,55vh);display:block}button{margin:.3rem;padding:.5rem 1rem;font:inherit;background:#3b3560;color:#f4e9c0;border:1px solid #8a6a1f;border-radius:1rem}.rain{display:flex;align-items:center;gap:.6rem;margin:.2rem;font-size:.95rem}.rain input{width:min(50vw,240px);accent-color:#c9a23c}</style></head><body><h1>Round Window Rain Bell</h1><p>Raindrops slide down a round window and ring a humming bell whenever they reach it.</p><canvas id="c" width="600" height="600"></canvas><div class="rain"><label for="rate">Light</label><input id="rate" type="range" min="1" max="40" value="14" aria-label="Rain amount"><span>Heavy</span></div><button id="snd">Wake the bell's hum</button><script>
// Wendle's round window, step 5: a slider chooses light or heavy rain.
const c=document.getElementById('c'),g=c.getContext('2d');
const W=600,cx=300,cy=300,R=230;

// a few fixed clouds and rain streaks so the sky looks the same each time
const clouds=[[200,170,70],[320,150,85],[420,190,65],[260,210,80],[370,225,70]];
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
const streaks=[];for(let i=0;i<70;i++)streaks.push([rnd()*W,rnd()*W,10+rnd()*14]);

// I draw the still scenery once onto a hidden canvas, then copy it every frame
const bg=document.createElement('canvas');bg.width=bg.height=W;
const b=bg.getContext('2d');
b.fillStyle='#1b1a2e';b.fillRect(0,0,W,W);
b.save();b.beginPath();b.arc(cx,cy,R,0,Math.PI*2);b.clip();
const sky=b.createLinearGradient(0,cy-R,0,cy+R);
sky.addColorStop(0,'#3d4a66');sky.addColorStop(1,'#7e8fa6');
b.fillStyle=sky;b.fillRect(0,0,W,W);
b.fillStyle='rgba(40,48,68,.85)';
for(const [x,y,r] of clouds){b.beginPath();b.arc(x,y,r,0,7);b.fill()}
b.fillRect(150,200,320,40);
b.strokeStyle='rgba(200,220,240,.35)';b.lineWidth=1.5;
for(const [x,y,l] of streaks){b.beginPath();b.moveTo(x,y);b.lineTo(x-l*.3,y+l);b.stroke()}
const sh=b.createRadialGradient(240,230,10,300,300,R);
sh.addColorStop(0,'rgba(255,255,255,.18)');sh.addColorStop(.4,'rgba(255,255,255,0)');
b.fillStyle=sh;b.fillRect(0,0,W,W);
b.restore();

// the frame goes on top of the drops, so I keep it separate
const fr=document.createElement('canvas');fr.width=fr.height=W;
const f=fr.getContext('2d');
f.lineWidth=26;f.strokeStyle='#6b4a2f';
f.beginPath();f.arc(cx,cy,R+13,0,7);f.stroke();
f.lineWidth=3;f.strokeStyle='#3b2819';
f.beginPath();f.arc(cx,cy,R+26,0,7);f.stroke();
f.beginPath();f.arc(cx,cy,R,0,7);f.stroke();
f.lineWidth=12;f.strokeStyle='#6b4a2f';
f.beginPath();f.moveTo(cx,cy-R);f.lineTo(cx,cy+R);f.moveTo(cx-R,cy);f.lineTo(cx+R,cy);f.stroke();

// the bell: a little brass bell sitting at the bottom of the glass, drawn once
const BX=cx+55,BY=cy+R-6;
const bell=document.createElement('canvas');bell.width=bell.height=W;
const e=bell.getContext('2d');
e.strokeStyle='#8a6a1f';e.lineWidth=3;
e.beginPath();e.arc(BX,BY-48,5,0,7);e.stroke();
const bodyG=e.createLinearGradient(BX-22,0,BX+22,0);
bodyG.addColorStop(0,'#a9791f');bodyG.addColorStop(.4,'#f4d36b');bodyG.addColorStop(1,'#8a5f14');
e.fillStyle=bodyG;
e.beginPath();
e.moveTo(BX-6,BY-44);
e.quadraticCurveTo(BX-22,BY-38,BX-20,BY-14);
e.quadraticCurveTo(BX-20,BY-8,BX-28,BY-3);
e.lineTo(BX-28,BY);
e.lineTo(BX+28,BY);
e.lineTo(BX+28,BY-3);
e.quadraticCurveTo(BX+20,BY-8,BX+20,BY-14);
e.quadraticCurveTo(BX+22,BY-38,BX+6,BY-44);
e.closePath();e.fill();
e.strokeStyle='#5a3d0c';e.lineWidth=1.5;e.stroke();
e.strokeStyle='rgba(255,255,255,.55)';e.lineWidth=2.5;e.lineCap='round';
e.beginPath();e.moveTo(BX-10,BY-34);e.quadraticCurveTo(BX-14,BY-22,BX-13,BY-14);e.stroke();
e.fillStyle='#5a3d0c';e.beginPath();e.arc(BX,BY+1,5,0,7);e.fill();

// ---- sound ----
// browsers only let sound start after a tap, so the button wakes it up
let ac=null,lastRing=-1;
const snd=document.getElementById('snd');
snd.onclick=()=>{
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){snd.textContent='No sound here, sorry';return}
    ac=new AC();
  }
  if(ac.state==='suspended')ac.resume();
  snd.textContent='The bell is awake (rain on!)';
  hum(0);
};
// a soft hum: two gentle sine waves, slow fade in and a long fade out
const notes=[392,440,523.25,587.33,659.25]; // a calm pentatonic set
function hum(k){
  if(!ac||ac.state!=='running')return;
  const now=ac.currentTime;
  if(now-lastRing<.15)return; // don't pile up too many at once
  lastRing=now;
  const fq=notes[Math.max(0,k)%notes.length];
  const out=ac.createGain();
  out.gain.setValueAtTime(0,now);
  out.gain.linearRampToValueAtTime(.12,now+.04);
  out.gain.exponentialRampToValueAtTime(.0005,now+2.2);
  out.connect(ac.destination);
  [[1,1],[2.01,.25]].forEach(([m,a])=>{
    const o=ac.createOscillator(),v=ac.createGain();
    o.type='sine';o.frequency.value=fq*m;v.gain.value=a;
    o.connect(v);v.connect(out);
    o.start(now);o.stop(now+2.3);
  });
}

// the rain slider: it sets how many drops are on the glass at once
const rate=document.getElementById('rate');
let target=+rate.value;
rate.oninput=()=>{target=+rate.value};

// raindrops: each one wobbles slowly down, leaving a thin wet trail
const drops=[];
function newDrop(top){
  const a=rnd()*Math.PI*2,d=Math.sqrt(rnd())*R*.9;
  let x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;
  if(top){x=cx+(rnd()*2-1)*R*.8;y=cy-Math.sqrt(Math.max(0,R*R-(x-cx)*(x-cx)))+6}
  drops.push({x,y,r:2.5+rnd()*3,v:.3+rnd()*.7,ph:rnd()*6,trail:[]});
}
for(let i=0;i<target;i++)newDrop(false);

// when a drop leaves, I only replace it if there are fewer drops than the slider wants
function replace(i){
  drops.splice(i,1);
  if(drops.length<target)newDrop(true);
}

let last=0,glow=0;
function frame(t){
  const dt=Math.min(40,t-last||16)/16;last=t;
  // heavier rain: add a new drop at the top now and then; lighter rain: drops just aren't replaced
  if(drops.length<target&&rnd()<.08*dt)newDrop(true);
  g.drawImage(bg,0,0);
  g.save();g.beginPath();g.arc(cx,cy,R,0,7);g.clip();
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.ph+=.05*dt;
    const speed=d.v*(.4+.6*Math.max(0,Math.sin(d.ph*1.3)+.3));
    d.y+=speed*dt*1.6;
    d.x+=Math.sin(d.ph)*.25*dt;
    // low on the glass the drops lean a little toward the bell (the glass is a bit tilted, I decided)
    if(d.y>cy+40)d.x+=(BX-d.x)*.012*dt;
    d.trail.push([d.x,d.y]);if(d.trail.length>40)d.trail.shift();
    g.strokeStyle='rgba(210,230,250,.22)';g.lineWidth=d.r*.5;g.lineCap='round';
    g.beginPath();d.trail.forEach(([x,y],k)=>k?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
    g.fillStyle='rgba(190,215,240,.5)';
    g.beginPath();g.ellipse(d.x,d.y,d.r*.85,d.r*1.15,0,0,7);g.fill();
    g.fillStyle='rgba(255,255,255,.7)';
    g.beginPath();g.arc(d.x-d.r*.3,d.y-d.r*.3,d.r*.3,0,7);g.fill();
    // did it land on the bell? ding! the bell hums and the drop is gone
    if(Math.abs(d.x-BX)<22&&d.y>BY-42&&d.y<BY-8){
      glow=1;hum(Math.floor((d.r-2.5)/3.5*5));
      replace(i);continue;
    }
    // off the bottom of the glass? start a new one at the top
    if(Math.hypot(d.x-cx,d.y-cy)>R-2&&d.y>cy){replace(i)}
  }
  // if the slider went down a lot, let extra drops quietly dry up
  while(drops.length>target+3)drops.pop();
  g.restore();
  g.save();g.beginPath();g.arc(cx,cy,R+2,0,7);g.clip();
  g.drawImage(bell,0,0);
  // a warm glow shows the bell is humming
  if(glow>0.01){
    const gr=g.createRadialGradient(BX,BY-22,2,BX,BY-22,50);
    gr.addColorStop(0,'rgba(255,230,140,'+(.55*glow)+')');gr.addColorStop(1,'rgba(255,230,140,0)');
    g.fillStyle=gr;g.fillRect(BX-60,BY-80,120,100);
    glow*=Math.pow(.97,dt);
  }
  g.restore();
  g.drawImage(fr,0,0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
