<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; worker-src blob:"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Round Window Rain Bell</title><style>html,body{margin:0;height:100%;background:#1b1a2e;color:#d9d4f0;font-family:Georgia,serif;text-align:center}body{display:flex;flex-direction:column;align-items:center;justify-content:center}h1{font-size:1.4rem;margin:.4rem}p{margin:.2rem .8rem .8rem;font-size:.95rem}canvas{width:min(86vw,70vh);height:min(86vw,70vh);display:block}</style></head><body><h1>Round Window Rain Bell</h1><p>A little round window on a rainy night, where raindrops trickle down the glass and will soon ring a bell.</p><canvas id="c" width="600" height="600"></canvas><script>
// Wendle's round window, step 2: raindrops trickle down the glass.
const c=document.getElementById('c'),g=c.getContext('2d');
const W=600,cx=300,cy=300,R=230;

// a few fixed clouds and rain streaks so the sky looks the same each time
const clouds=[[200,170,70],[320,150,85],[420,190,65],[260,210,80],[370,225,70]];
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
const streaks=[];for(let i=0;i<70;i++)streaks.push([rnd()*W,rnd()*W,10+rnd()*14]);

// I draw the still scenery once onto a hidden canvas, then copy it every frame
const bg=document.createElement('canvas');bg.width=bg.height=W;
const b=bg.getContext('2d');
b.fillStyle='#1b1a2e';b.fillRect(0,0,W,W);
b.save();b.beginPath();b.arc(cx,cy,R,0,Math.PI*2);b.clip();
const sky=b.createLinearGradient(0,cy-R,0,cy+R);
sky.addColorStop(0,'#3d4a66');sky.addColorStop(1,'#7e8fa6');
b.fillStyle=sky;b.fillRect(0,0,W,W);
b.fillStyle='rgba(40,48,68,.85)';
for(const [x,y,r] of clouds){b.beginPath();b.arc(x,y,r,0,7);b.fill()}
b.fillRect(150,200,320,40);
b.strokeStyle='rgba(200,220,240,.35)';b.lineWidth=1.5;
for(const [x,y,l] of streaks){b.beginPath();b.moveTo(x,y);b.lineTo(x-l*.3,y+l);b.stroke()}
const sh=b.createRadialGradient(240,230,10,300,300,R);
sh.addColorStop(0,'rgba(255,255,255,.18)');sh.addColorStop(.4,'rgba(255,255,255,0)');
b.fillStyle=sh;b.fillRect(0,0,W,W);
b.restore();

// the frame goes on top of the drops later, so I keep it separate
const fr=document.createElement('canvas');fr.width=fr.height=W;
const f=fr.getContext('2d');
f.lineWidth=26;f.strokeStyle='#6b4a2f';
f.beginPath();f.arc(cx,cy,R+13,0,7);f.stroke();
f.lineWidth=3;f.strokeStyle='#3b2819';
f.beginPath();f.arc(cx,cy,R+26,0,7);f.stroke();
f.beginPath();f.arc(cx,cy,R,0,7);f.stroke();
f.lineWidth=12;f.strokeStyle='#6b4a2f';
f.beginPath();f.moveTo(cx,cy-R);f.lineTo(cx,cy+R);f.moveTo(cx-R,cy);f.lineTo(cx+R,cy);f.stroke();

// raindrops: each one wobbles slowly down, leaving a thin wet trail
const drops=[];
function newDrop(top){
  // pick a spot inside the circle near the top
  const a=rnd()*Math.PI*2,d=Math.sqrt(rnd())*R*.9;
  let x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;
  if(top){x=cx+(rnd()*2-1)*R*.8;y=cy-Math.sqrt(Math.max(0,R*R-(x-cx)*(x-cx)))+6}
  drops.push({x,y,r:2.5+rnd()*3,v:.3+rnd()*.7,ph:rnd()*6,trail:[]});
}
for(let i=0;i<14;i++)newDrop(false);

let last=0;
function frame(t){
  const dt=Math.min(40,t-last||16)/16;last=t;
  g.drawImage(bg,0,0);
  g.save();g.beginPath();g.arc(cx,cy,R,0,7);g.clip();
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    // sometimes a drop pauses, then slides on
    d.ph+=.05*dt;
    const speed=d.v*(.4+.6*Math.max(0,Math.sin(d.ph*1.3)+.3));
    d.y+=speed*dt*1.6;
    d.x+=Math.sin(d.ph)*.25*dt;
    d.trail.push([d.x,d.y]);if(d.trail.length>40)d.trail.shift();
    // trail
    g.strokeStyle='rgba(210,230,250,.22)';g.lineWidth=d.r*.5;g.lineCap='round';
    g.beginPath();d.trail.forEach(([x,y],k)=>k?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
    // the drop itself, with a tiny highlight
    g.fillStyle='rgba(190,215,240,.5)';
    g.beginPath();g.ellipse(d.x,d.y,d.r*.85,d.r*1.15,0,0,7);g.fill();
    g.fillStyle='rgba(255,255,255,.7)';
    g.beginPath();g.arc(d.x-d.r*.3,d.y-d.r*.3,d.r*.3,0,7);g.fill();
    // off the bottom of the glass? start a new one at the top
    if(Math.hypot(d.x-cx,d.y-cy)>R-2&&d.y>cy){drops.splice(i,1);newDrop(true)}
  }
  g.restore();
  g.drawImage(fr,0,0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
